name: Detection Engineering CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-convert-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install pysigma sigma-cli pyyaml pytest jinja2 fastapi uvicorn sqlalchemy httpx watchdog

      - name: 1 - YAML lint
        run: |
          python -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('rules/sigma/**/*.yml', recursive=True):
              try: yaml.safe_load(open(f))
              except Exception as e: errors.append(f'{f}: {e}')
          if errors: print('\n'.join(errors)); sys.exit(1)
          print('YAML lint passed')
          "

      - name: 2 - Sigma validation
        run: sigma check rules/sigma/

      - name: 3 - Convert to Wazuh XML + KQL + SPL
        run: |
          mkdir -p rules/wazuh converted/kql converted/splunk
          python scripts/convert_sigma.py \
            --input rules/sigma/ \
            --wazuh rules/wazuh/ \
            --kql converted/kql/ \
            --splunk converted/splunk/ \
            --production

      - name: 4 - Detection regression tests (pytest)
        run: pytest tests/test_detections.py -v

      - name: 5 - FastAPI REST & CQRS integration tests (pytest)
        run: pytest tests/test_api.py -v

      - name: 6 - Full log replay harness regression test
        run: python scripts/replay_logs.py --type all --verbose

      - name: 7 - UI TypeScript diagnostics and production build
        run: |
          cd ui
          npm ci
          npx svelte-check
          npm run build

      - name: 8 - Upload converted rules as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules-${{ github.sha }}
          path: |
            rules/wazuh/
            converted/kql/
            converted/splunk/
