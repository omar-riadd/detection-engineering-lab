title: Credential Dumping Followed by Rapid Lateral SMB Network Share Access
id: a769f615-2364-4d7f-9e76-672463906006
status: experimental
description: |
  Detects an LSASS process access or memory dump event followed rapidly (within 300 seconds) by an administrative
  network share access event (Event ID 5140) from the same host. This temporal sequence is characteristic of
  adversaries extracting credentials from memory and immediately pivoting laterally to adjacent domain systems.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1021/002/
author: Detection Engineering Team
date: 2026-10-21
modified: 2026-10-21
tags:
  - attack.t1003.001
  - attack.t1021.002
  - attack.credential_access
  - attack.lateral_movement
logsource:
  product: windows
detection:
  selection_dump:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
  selection_lateral:
    EventID: 5140
  condition: selection_dump then selection_lateral
timeframe: 300s
groupby: ComputerName
falsepositives:
  - Authorized administrative workflows or automated vulnerability scanners concurrently auditing credentials and shares
level: critical
