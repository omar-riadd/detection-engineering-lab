title: Suspicious Outbound C2 Network Connection via LOLBin or Utility
id: 248eb597-2698-4687-0817-4895148f6018
status: experimental
description: |
  Detects network connections (Sysmon Event ID 3) initiated by living-off-the-land binaries or script utilities
  (curl.exe, certutil.exe, bitsadmin.exe, powershell.exe) connecting to non-standard ports or external destinations.
  Adversaries leverage these native tools to exfiltrate staged data or communicate with external command and control (C2) servers.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-075a
  - https://redcanary.com/threat-detection-report/
  - https://attack.mitre.org/techniques/T1041/
author: Detection Engineering Team
date: 2026-10-19
modified: 2026-10-19
tags:
  - attack.t1041
  - attack.exfiltration
  - attack.command_and_control
logsource:
  product: windows
  category: network_connection
detection:
  selection_event:
    EventID: 3
  selection_binary:
    Image|endswith:
      - '\curl.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  selection_direction:
    Initiated: 'true'
  filter_web_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
  filter_standard_ports:
    DestinationPort:
      - 80
      - 443
  condition: selection_event and selection_binary and selection_direction and not filter_web_browsers and not filter_standard_ports
falsepositives:
  - Enterprise software updates or developers using curl for custom internal non-standard API endpoints
level: high
