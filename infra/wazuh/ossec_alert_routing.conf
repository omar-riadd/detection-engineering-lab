<!-- Wazuh Manager Alert Routing & Indexer Forwarding Configuration -->
<!-- Enables dedicated routing for High (Level >= 10) and Critical (Level >= 12) alerts -->

<ossec_config>
  <!-- 1. Email Alert Routing for High/Critical Events -->
  <global>
    <email_notification>yes</email_notification>
    <email_to>soc-tier2@corp.local</email_to>
    <smtp_server>192.168.56.10</smtp_server>
    <email_from>wazuh-alerts@corp.local</email_from>
    <email_maxperhour>100</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>10</email_alert_level>
  </alerts>

  <!-- 2. Priority Routing via Custom Email Alerts -->
  <email_alerts>
    <email_to>incident-response@corp.local</email_to>
    <level>12</level>
    <group>windows,process_creation,credential_access,</group>
    <format>full</format>
  </email_alerts>

  <!-- 3. Integrator Webhook Routing (Slack / PagerDuty / Webhook) -->
  <integration>
    <name>custom-webhook</name>
    <hook_url>https://hooks.example.com/services/YOUR_WEBHOOK_URL_HERE</hook_url>
    <level>10</level>
    <group>attack.t1003.001,attack.t1055.012,attack.t1490,attack.t1486</group>
    <alert_format>json</alert_format>
  </integration>

  <!-- 4. Dedicated Indexer Pipeline Routing -->
  <!-- Routes Level >= 10 alerts to dedicated priority index: wazuh-alerts-priority-* -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/wazuh-indexer/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/wazuh-indexer/certs/admin.pem</certificate>
      <key>/etc/wazuh-indexer/certs/admin-key.pem</key>
    </ssl>
    <indices>
      <index>
        <name>wazuh-alerts-priority</name>
        <min_level>10</min_level>
      </index>
      <index>
        <name>wazuh-alerts-standard</name>
        <min_level>3</min_level>
      </index>
    </indices>
  </indexer>

  <!-- 5. Syslog Forwarding to External Cold Storage / SIEM -->
  <syslog_output>
    <server>192.168.56.1</server>
    <port>514</port>
    <format>json</format>
    <level>10</level>
  </syslog_output>
</ossec_config>
